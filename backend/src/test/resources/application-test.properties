# ============================================================
# Perfil de testes de integração
# ============================================================

spring.application.name=systempro-api-test


# ------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------
# Flyway
# ------------------------------------------------------------

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true

# ------------------------------------------------------------
# JWT
# Valores exclusivos para os testes.
# Não são segredos reais.
# ------------------------------------------------------------

jwt.secret.access=c3lzdGVtcHJvLWludGVncmF0aW9uLXRlc3QtYWNjZXNzLWtleS1BQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
jwt.secret.refresh=c3lzdGVtcHJvLWludGVncmF0aW9uLXRlc3QtcmVmcmVzaC1rZXktQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJC

jwt.issuer=systempro-test
jwt.audience=systempro-test
jwt.expiration=3600000
jwt.refresh-token.expiration=86400000

# ------------------------------------------------------------
# Swagger
# ------------------------------------------------------------

springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config

# ------------------------------------------------------------
# Logs
# ------------------------------------------------------------

logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.flywaydb=INFO
logging.level.org.springframework.boot.flyway=INFO

# Storage isolado para testes
systempro.storage.local-storage-location=target/test-storage/supplier-documents

# Imagens de produtos
systempro.images.storage-location=target/test-storage/product-images