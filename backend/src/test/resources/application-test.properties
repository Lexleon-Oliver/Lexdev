# ============================================================
# Perfil de testes de integração
# ============================================================

spring.application.name=systempro-api-test


# ------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------
# Flyway
# ------------------------------------------------------------

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true

# ------------------------------------------------------------
# JWT
# Valores exclusivos para os testes.
# Não são segredos reais.
# ------------------------------------------------------------

SECRET_KEY=systempro-test-access-secret-12345678901234567890123456789012345678901234567890
SECRET_REFRESH_KEY=systempro-test-refresh-secret-12345678901234567890123456789012345678901234567890

JWT_ISSUER=systempro-test
JWT_AUDIENCE=systempro-test
JWT_EXPIRATION=3600000
JWT_REFRESH_EXPIRATION=86400000

# ------------------------------------------------------------
# Swagger
# ------------------------------------------------------------

springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config

# ------------------------------------------------------------
# Logs
# ------------------------------------------------------------

logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.flywaydb=INFO
logging.level.org.springframework.boot.flyway=INFO