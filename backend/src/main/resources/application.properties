# Nome da Aplicação
spring.application.name=systempro-api

# Configuração de Conexão com o PostgreSQL
# Utiliza a sintaxe ${VARIAVEL:valor_padrao} para funcionar tanto no Docker quanto rodando direto no Spring Boot/IDE
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================================
# JPA / Hibernate
# ============================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Flyway
# ============================================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema atual do SystemPro
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true

# Configurações de Segurança e JWT (Variáveis customizadas)
jwt.secret.access=${SECRET_KEY}
jwt.secret.refresh=${SECRET_REFRESH_KEY}
jwt.issuer=${JWT_ISSUER}
jwt.audience=${JWT_AUDIENCE}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION}

# Configura o Swagger UI para buscar os schemas com o prefixo do Nginx (/api)
springdoc.swagger-ui.url=/api/v3/api-docs
springdoc.swagger-ui.config-url=/api/v3/api-docs/swagger-config

# Faz o Spring reconhecer o X-Forwarded-Prefix enviado pelo Nginx (/api)
server.forward-headers-strategy=framework

# Ativa logs detalhados do Spring Security e do Web Dispatcher
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.flyway=DEBUG

systempro.images.storage-location=/data/product-images

systempro.images.max-file-size-bytes=5242880

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB