# Nome da Aplicação
spring.application.name=systempro-api

# Configuração de Conexão com o PostgreSQL
# Utiliza a sintaxe ${VARIAVEL:valor_padrao} para funcionar tanto no Docker quanto rodando direto no Spring Boot/IDE
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================================
# JPA / Hibernate
# ============================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Flyway
# ============================================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema atual do SystemPro
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
spring.flyway.postgresql.transactional-lock= false


# Configurações de Segurança e JWT (Variáveis customizadas)
jwt.secret.access=${SECRET_KEY}
jwt.secret.refresh=${SECRET_REFRESH_KEY}
jwt.issuer=${JWT_ISSUER}
jwt.audience=${JWT_AUDIENCE}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION}

# Configura o Swagger UI para buscar os schemas com o prefixo do Nginx (/api)
springdoc.swagger-ui.url=/api/v3/api-docs
springdoc.swagger-ui.config-url=/api/v3/api-docs/swagger-config

# Faz o Spring reconhecer o X-Forwarded-Prefix enviado pelo Nginx (/api)
server.forward-headers-strategy=framework

# Ativa logs detalhados do Spring Security e do Web Dispatcher
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.flyway=DEBUG

systempro.images.storage-location=/data/product-images
systempro.images.max-file-size-bytes=5242880


refresh-token.cleanup.fixed-delay=15m
refresh-token.cleanup.initial-delay=1m
refresh-token.cleanup.grace-period=1h
refresh-token.cleanup.batch-size=1000
refresh-token.cleanup.max-batches-per-run=20

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
spring.servlet.multipart.file-size-threshold=0B

# ============================================================
# Armazenamento de documentos
# ============================================================

systempro.storage.provider=${STORAGE_PROVIDER:local}

systempro.storage.local-storage-location=${STORAGE_LOCAL_STORAGE_LOCATION:/data/supplier-documents}

systempro.storage.endpoint=${STORAGE_ENDPOINT:}
systempro.storage.region=${STORAGE_REGION:us-east-1}
systempro.storage.access-key=${STORAGE_ACCESS_KEY:}
systempro.storage.secret-key=${STORAGE_SECRET_KEY:}
systempro.storage.bucket=${STORAGE_BUCKET:systempro-documents}
systempro.storage.path-style-access=${STORAGE_PATH_STYLE_ACCESS:false}
systempro.storage.max-file-size-bytes=${STORAGE_MAX_FILE_SIZE_BYTES:15728640}

# ============================================================
# ClamAV
# ============================================================

systempro.clamav.host=${CLAMAV_HOST:clamav}
systempro.clamav.port=${CLAMAV_PORT:3310}
systempro.clamav.timeout-seconds=${CLAMAV_TIMEOUT_SECONDS:30}

# ============================================================
# Fiscal / NFC-e MG
# ============================================================
systempro.fiscal.enabled=${FISCAL_ENABLED:false}
systempro.fiscal.connect-timeout-seconds=${FISCAL_CONNECT_TIMEOUT_SECONDS:10}
systempro.fiscal.request-timeout-seconds=${FISCAL_REQUEST_TIMEOUT_SECONDS:30}
systempro.fiscal.encryption-key=${FISCAL_ENCRYPTION_KEY:}
systempro.fiscal.schema-version=${FISCAL_SCHEMA_VERSION:4.00}
systempro.fiscal.product-version=${FISCAL_PRODUCT_VERSION:SystemPro}
systempro.fiscal.trust-store-path=${FISCAL_TRUST_STORE_PATH:}
systempro.fiscal.trust-store-password=${FISCAL_TRUST_STORE_PASSWORD:}
systempro.fiscal.certificate-content-type=application/x-pkcs12

systempro.fiscal.production-ready=${FISCAL_PRODUCTION_READY:false}