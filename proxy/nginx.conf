events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream api_backend {
        server backend:8080;
    }

    upstream frontend_app {
        server frontend:80;
    }

    server {
        server_name lexdev.ddns.net localhost;
        client_max_body_size 10M;

        # Remove o prefixo /api antes de enviar para o Spring Boot
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    



    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lexdev.ddns.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lexdev.ddns.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


    server {
    if ($host = lexdev.ddns.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


        server_name lexdev.ddns.net localhost;
    listen 80;
    return 404; # managed by Certbot


}}