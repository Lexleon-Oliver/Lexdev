services:
  db:
    image: postgres:16-alpine
    container_name: systempro_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET_ACCESS=${SECRET_KEY}
      - JWT_SECRET_REFRESH=${SECRET_REFRESH_KEY}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
      - FISCAL_ENABLED=true
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - FISCAL_ENCRYPTION_KEY=${FISCAL_ENCRYPTION_KEY}
      - BACKUP_STORAGE_LOCATION=/data/backups
      - AI_ENABLED=${AI_ENABLED:-false}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - AI_MAX_OUTPUT_TOKENS=${AI_MAX_OUTPUT_TOKENS:-600}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-6-luna}
      - AI_CONNECT_TIMEOUT_SECONDS=${AI_CONNECT_TIMEOUT_SECONDS:-10}
      - AI_REQUEST_TIMEOUT_SECONDS=${AI_REQUEST_TIMEOUT_SECONDS:-30}

    depends_on:
      db:
        condition: service_started

    deploy:
      replicas: 1

    volumes:
      - systempro_product_images:/data/product-images
      - systempro_supplier_documents:/data/supplier-documents
      - systempro_backups:/data/backups

    restart: unless-stopped

  restore:
    profiles:
      - maintenance
    build:
      context: ./backend/restore
      dockerfile: Dockerfile
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - PRODUCT_IMAGES_PATH=/data/product-images
      - DOCUMENTS_PATH=/data/supplier-documents
      - RESTORE_WORK_PATH=/restore-work
      - RESTORE_STORAGE_UID=100
      - RESTORE_STORAGE_GID=101
    depends_on:
      db:
        condition: service_started
    volumes:
      - systempro_product_images:/data/product-images
      - systempro_supplier_documents:/data/supplier-documents
      - systempro_backups:/data/backups:ro
      - systempro_restore_work:/restore-work
    restart: "no"


  recovery:
    profiles:
      - maintenance
    build:
      context: ./backend/recovery
      dockerfile: Dockerfile
    environment:
      - FISCAL_ENCRYPTION_KEY=${FISCAL_ENCRYPTION_KEY:-}
      - SYSTEMPRO_INSTANCE_DIR=/data/systempro-instance
    volumes:
      - systempro_instance:/data/systempro-instance:ro
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped

  proxy:
      build:
        context: ./proxy
        dockerfile: Dockerfile
      image: systempro-proxy:local
      container_name: systempro_proxy
      ports:
        - "80:80"
        - "443:443"
      volumes:
        - ./proxy/nginx.conf:/etc/nginx/nginx.conf
        - systempro_letsencrypt:/etc/letsencrypt
      depends_on:
        - backend
        - frontend
      restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped

volumes:
  systempro_product_images:
  systempro_supplier_documents:
  systempro_backups:
  systempro_letsencrypt:
  pgdata:
