<div class="company-page">
  <header class="page-header">
    <div class="page-header-title">
      <h2>Empresa</h2>
      <p>
        Cadastre ou altere a empresa proprietária deste ambiente do SystemPro.
      </p>
    </div>

    <button type="button" class="secondary" (click)="openFiscal()">
      <i class="fas fa-file-invoice"></i> Configurar NFC-e
    </button>
  </header>

  @if (isLoading) {
    <div class="panel state">
      <i class="fas fa-spinner fa-spin"></i>
      Carregando dados da empresa…
    </div>
  } @else {
    <div class="panel">
      <app-company-form
        [company]="company"
        (saved)="onSaved($event)"
      />
    </div>
  }
</div>
