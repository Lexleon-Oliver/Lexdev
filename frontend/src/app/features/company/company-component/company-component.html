<div class="company-page">
  <!-- ===== Cabeçalho ===== -->
  <header class="page-header">
    <div class="page-header-title">
      <h2>Empresa</h2>
      <p>
        Cadastre a empresa proprietária deste ambiente do SystemPro. Ela é a
        referência usada pela configuração fiscal.
      </p>
    </div>
    <button type="button" class="secondary" (click)="openFiscal()">
      <i class="fas fa-file-invoice"></i> Configurar NFC-e
    </button>
  </header>

  @if (isLoading) {
    <div class="panel state">
      <i class="fas fa-spinner fa-spin"></i> Carregando dados da empresa…
    </div>
  } @else {
    <form class="panel form" [formGroup]="form" (ngSubmit)="save()">
      <!-- ===== Identificação ===== -->
      <section class="section-block">
        <h3>Identificação</h3>
        <div class="grid two">
          <label class="field-label">
            Razão social <span class="required">*</span>
            <input formControlName="name" autocomplete="organization" />
          </label>
          <label class="field-label">
            CNPJ <span class="required">*</span>
            <input
              formControlName="cpfCnpj"
              inputmode="numeric"
              maxlength="14"
              autocomplete="off"
            />
          </label>
        </div>
        <div class="grid two">
          <label class="field-label">
            Nome fantasia
            <input formControlName="nomeFantasia" autocomplete="organization" />
          </label>
          <label class="field-label">
            Inscrição estadual
            <input formControlName="inscricaoEstadual" inputmode="numeric" />
          </label>
        </div>
      </section>

      <!-- ===== Contato ===== -->
      <section class="section-block">
        <h3>Contato</h3>
        <div class="grid two">
          <label class="field-label">
            E-mail
            <input formControlName="email" type="email" autocomplete="email" />
          </label>
          <label class="field-label">
            Telefone
            <input formControlName="telefone" inputmode="tel" autocomplete="tel" />
          </label>
        </div>
      </section>

      <!-- ===== Endereço ===== -->
      <section class="section-block">
        <h3>Endereço comercial</h3>
        <div class="grid three">
          <label class="field-label">
            CEP
            <input formControlName="cep" inputmode="numeric" maxlength="8" />
          </label>
          <label class="field-label">
            UF
            <input formControlName="uf" maxlength="2" />
          </label>
          <label class="field-label">
            Cidade
            <input formControlName="cidade" />
          </label>
        </div>
        <div class="grid two">
          <label class="field-label">
            Logradouro
            <input formControlName="logradouro" />
          </label>
          <label class="field-label">
            Número
            <input formControlName="numero" />
          </label>
        </div>
        <div class="grid two">
          <label class="field-label">
            Complemento
            <input formControlName="complemento" />
          </label>
          <label class="field-label">
            Bairro
            <input formControlName="bairro" />
          </label>
        </div>
      </section>

      <!-- ===== Ações ===== -->
      <div class="actions">
        <button type="submit" class="primary" [disabled]="isSaving">
          @if (isSaving) {
            <i class="fas fa-spinner fa-spin"></i> Salvando…
          } @else {
            <i class="fas fa-save"></i> Salvar empresa
          }
        </button>
      </div>
    </form>
  }
</div>
