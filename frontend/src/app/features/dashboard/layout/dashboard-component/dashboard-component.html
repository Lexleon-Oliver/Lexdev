<div class="dashboard-wrapper">
  <!-- Sidebar (Desktop) -->
  <aside class="sidebar" [class.collapsed]="isSidebarCollapsed">
    <div class="sidebar-header d-flex align-items-center">
      <span class="sidebar-brand">
        <i class="bi bi-hexagon-fill me-2"></i>
        <span *ngIf="!isSidebarCollapsed">Lexdev</span>
      </span>
      <button class="btn btn-link text-white d-none d-lg-block" (click)="toggleSidebar()">
        <i class="bi" [class.bi-chevron-left]="!isSidebarCollapsed" [class.bi-chevron-right]="isSidebarCollapsed"></i>
      </button>
    </div>

    <nav class="sidebar-nav">
      <div *ngFor="let item of menuItems" class="nav-item">
        <!-- Item sem submenu -->
        <a *ngIf="item.route" class="nav-link" [routerLink]="item.route" routerLinkActive="active">
          <i class="bi {{ item.icon }}"></i>
          <span *ngIf="!isSidebarCollapsed">{{ item.label }}</span>
        </a>

        <!-- Item com submenu (dropdown) -->
        <ng-container *ngIf="!item.route && item.children.length > 0">
          <a class="nav-link" (click)="toggleSubmenu(item)"
            [class.active]="isSubmenuActive(item)"
            data-bs-toggle="collapse"
            [attr.data-bs-target]="'#submenu-' + item.label">
            <i class="bi {{ item.icon }}"></i>
            <span *ngIf="!isSidebarCollapsed">{{ item.label }}</span>
            <i class="bi bi-chevron-down ms-auto submenu-arrow" *ngIf="!isSidebarCollapsed"></i>
          </a>
          <div class="collapse" [id]="'submenu-' + item.label">
            <ul class="nav flex-column submenu">
              <li *ngFor="let child of item.children">
                <a *ngIf="child.route" class="nav-link" [routerLink]="child.route" routerLinkActive="active">
                  <i class="bi {{ child.icon }}"></i>
                  <span *ngIf="!isSidebarCollapsed">{{ child.label }}</span>
                </a>
              </li>
            </ul>
          </div>
        </ng-container>
      </div>
    </nav>
  </aside>

  <!-- Sidebar Mobile (Offcanvas) -->
  <div class="mobile-sidebar" [class.open]="isMobileSidebarOpen">
    <div class="mobile-sidebar-header">
      <span class="sidebar-brand">
        <i class="bi bi-hexagon-fill me-2"></i> Lexdev
      </span>
      <button class="btn btn-link text-white" (click)="toggleMobileSidebar()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
    <nav class="sidebar-nav">
      <!-- Mesmos itens, mas sem colapso (podem ser expandidos por padrão) -->
      <div *ngFor="let item of menuItems" class="nav-item">
        <a *ngIf="item.route" class="nav-link" [routerLink]="item.route" routerLinkActive="active" (click)="toggleMobileSidebar()">
          <i class="bi {{ item.icon }}"></i> {{ item.label }}
        </a>
        <ng-container *ngIf="!item.route && item.children.length > 0">
          <a class="nav-link" data-bs-toggle="collapse" [attr.data-bs-target]="'#mobile-submenu-' + item.label">
            <i class="bi {{ item.icon }}"></i> {{ item.label }}
            <i class="bi bi-chevron-down ms-auto"></i>
          </a>
          <div class="collapse" [id]="'mobile-submenu-' + item.label">
            <ul class="nav flex-column submenu">
              <li *ngFor="let child of item.children">
                <a class="nav-link" [routerLink]="child.route" routerLinkActive="active" (click)="toggleMobileSidebar()">
                  <i class="bi {{ child.icon }}"></i> {{ child.label }}
                </a>
              </li>
            </ul>
          </div>
        </ng-container>
      </div>
    </nav>
  </div>
  <div class="mobile-backdrop" *ngIf="isMobileSidebarOpen" (click)="toggleMobileSidebar()"></div>

  <!-- Conteúdo principal -->
  <div class="main-content" [class.expanded]="isSidebarCollapsed">
    <!-- Barra Superior -->
    <header class="topbar d-flex align-items-center">
      <button class="btn btn-outline-secondary d-lg-none me-2" (click)="toggleMobileSidebar()">
        <i class="bi bi-list"></i>
      </button>
      <h5 class="page-title mb-0">Dashboard</h5> <!-- Pode ser dinâmico via serviço -->
      <div class="ms-auto d-flex align-items-center">
        <div class="dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle me-1"></i> {{ currentUser }}
          </a>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
            <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Perfil</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" (click)="logout()"><i class="bi bi-box-arrow-right me-2"></i>Sair</a></li>
          </ul>
        </div>
      </div>
    </header>

    <!-- Conteúdo da rota filha -->
    <main class="p-4">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
